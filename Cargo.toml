[package]
name = "gatewizz"
version = "0.1.0"
edition = "2024"
description = "Local HTTPS gate for code sent to AI models"
license = "Apache-2.0"
repository = "https://github.com/mycaravam-crypto/Gatewizz"
readme = "README.md"

[profile.release]
strip = true

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
