[package]
name = "gatewizz"
version = "0.1.0"
edition = "2024"
description = "Local HTTPS gate for code sent to AI models"
license = "Apache-2.0"
repository = "https://github.com/mycaravam-crypto/Gatewizz"
readme = "README.md"

[profile.release]
strip = true

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
toml = "1.2.1"


[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_Security"] }
