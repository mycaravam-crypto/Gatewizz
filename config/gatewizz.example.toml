# Gatewizz example configuration.
#
# Every key is optional; the values shown are the defaults. Unknown keys are
# rejected. Validate a file with:
#   gatewizz --config gatewizz.toml --check-config

[general]
# Loopback address the proxy listens on. Point HTTPS_PROXY/HTTP_PROXY here.
# Non-loopback addresses are rejected.
# listen = "127.0.0.1:8899"

# Ports a CONNECT may target. Any other port is blocked.
# allowed_connect_ports = [443]

# What happens to a request that no rule matches: "allow", "block" or "approve".
# default_action = "allow"

[limits]
# Concurrent client connections; connections over the limit are closed.
# max_connections = 512

# Largest request head (request line plus headers) in bytes; larger heads
# get 431.
# max_header_bytes = 65536

# Seconds for DNS lookup plus TCP connect to an upstream.
# connect_timeout_secs = 10

# Seconds a client has to send a complete request head, also between
# keep-alive requests.
# header_timeout_secs = 30

# Seconds the upstream has to answer with response headers.
# response_timeout_secs = 120

# Seconds a CONNECT tunnel may pass no bytes before it is closed.
# idle_timeout_secs = 300

# Seconds shutdown waits for in-flight requests (Ctrl+C or console close).
# shutdown_timeout_secs = 10

# Request bodies up to this many bytes are read in full and checked for
# secrets before any byte goes upstream.
# max_body_bytes = 8388608

# What happens to a larger or compressed body: "block" refuses it with 413
# (fail closed), "allow" forwards it recorded as partially_inspected.
# over_limit = "block"

[events]
# JSON Lines event file. Empty means %LOCALAPPDATA%\gatewizz\events.jsonl;
# "-" writes to stdout. Events hold metadata only: no bodies, header values
# or query strings.
# path = ""

# The file is rotated before a line would push it past this many bytes.
# max_file_bytes = 10485760

# Rotated files kept next to the live one (events.jsonl.1, .2, ...).
# keep_files = 5

[tls]
# Decrypt CONNECT tunnels so their requests can be checked. Needs the local CA:
# run `gatewizz ca install` first. Off, every HTTPS connection is a blind tunnel.
# intercept = false

# Hosts that keep a blind tunnel even when intercepting: clients that pin
# certificates or use mutual TLS. Exact names or "*.suffix".
# tunnel_hosts = []

[approval]
# Requests matched by an "approve" rule wait in the approval window (the tray,
# Windows only). Unanswered within this time, or with this many already
# waiting, they are blocked. So are they with no window, or while paused.
# timeout_secs = 60
# max_pending = 16

[monitor]
# Connection monitor (Windows): every outgoing TCP connection on the computer,
# per program, with its hostname where the Windows DNS cache knows it. Logged
# as "connection" events and shown in the Network tab. It only watches and
# needs no admin rights; nothing is blocked.
# enabled = false

# How often the connection tables are sampled, in milliseconds (100-60000).
# Connections shorter than this can be missed.
# poll_ms = 1000

# Remote IP -> hostname entries kept (16-1000000).
# dns_cache_size = 4096

# Allow/block/approve rules. Keys under `match` are optional and must all hold;
# "block" beats "approve" beats "allow"; with no match, general.default_action
# applies. A blocked request gets 403 naming the rule, and nothing is sent
# upstream. An "approve" request waits for the approval window ([approval]) and
# is blocked unless it is allowed there.
#
# match keys: host / not_host (exact names or "*.suffix"), process (image file
# name, e.g. "smartwizz.exe"), path_prefix, finding (a kind such as
# "secret.github_token", or "secret.*"), ai (true for requests to AI models).
#
# Rules on path, finding or ai cannot see inside a blind tunnel, so a "block"
# rule using them blocks such tunnels (fail closed). Turn on [tls] intercept to
# have them decided per request instead.
#
# Secrets go only to approved model hosts. An allowlist is one block rule with
# not_host.
# [[rules]]
# id = "secrets-only-to-approved-models"
# description = "Secrets may only be sent to the internal model gateway"
# match = { finding = "secret.*", not_host = ["llm.internal.example"] }
# action = "block"
# severity = "critical"
#
# A tool may only talk to its model host.
# [[rules]]
# id = "smartwizz-only-to-gemini"
# match = { process = ["smartwizz.exe"], not_host = ["generativelanguage.googleapis.com"] }
# action = "block"
# severity = "high"
#
# Ask before code goes to any model that is not the internal gateway.
# [[rules]]
# id = "ask-before-external-models"
# match = { ai = true, not_host = ["llm.internal.example"] }
# action = "approve"
# severity = "medium"
