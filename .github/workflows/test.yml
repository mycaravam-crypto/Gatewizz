# Format, lint and unit tests on every pull request and on main. Linux covers the pure logic quickly; Windows builds
# and lints the Win32 code paths that only compile there.
name: test
on:
  pull_request:
  push: { branches: [main] }
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Check versioning policy
        run: bash .github/scripts/semver-next.test.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The release binary, so a PR that breaks the shipping build fails here rather than after merge.
      - run: cargo build --release --locked
      # The shipping exe must carry the manifest (per-monitor DPI v2, asInvoker) from build.rs (#36).
      - name: Check embedded manifest
        run: |
          foreach ($p in 'PerMonitorV2', 'asInvoker') {
            if (-not (Select-String -Path target\release\gatewizz.exe -Pattern $p -SimpleMatch -Quiet)) { throw "manifest: $p missing" }
          }
