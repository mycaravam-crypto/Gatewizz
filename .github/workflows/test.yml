# Format, lint and unit tests on every pull request and on main. Linux covers the pure logic quickly; Windows builds
# and lints the Win32 code paths that only compile there.
name: test
on:
  pull_request:
  push: { branches: [main] }
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Check versioning policy
        run: bash .github/scripts/semver-next.test.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The release binary, so a PR that breaks the shipping build fails here rather than after merge.
      - run: cargo build --release --locked
      # Extract PE resource type RT_MANIFEST (24), ID 1. A string search in the EXE is not proof
      # that Windows can load the manifest resource.
      - name: Check embedded manifest resource
        shell: pwsh
        run: |
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mt) { throw "Windows SDK mt.exe not found" }
          & $mt "-inputresource:target\release\gatewizz.exe;#1" "-out:target\release\gatewizz.manifest"
          if ($LASTEXITCODE -ne 0) { throw "Could not extract embedded manifest resource" }
          foreach ($p in 'PerMonitorV2', 'asInvoker') {
            if (-not (Select-String -Path target\release\gatewizz.manifest -Pattern $p -SimpleMatch -Quiet)) {
              throw "embedded manifest: $p missing"
            }
          }
      # The shipping binary from a console: CLI output, exit codes and the startup Run-key round trip (#36).
      - name: CLI smoke test of the release binary
        shell: pwsh
        run: .github/scripts/windows-cli-smoke.ps1 -Exe target\release\gatewizz.exe
      # The acceptance script runs by hand on a real machine; at least make sure Windows PowerShell 5.1 parses it.
      - name: Parse the PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts\*.ps1, .github\scripts\*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) { Write-Host "$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
